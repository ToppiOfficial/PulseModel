name: Dev build

# Manual only. Overwrites the single rolling "dev" release with the current
# commit's build; the release body is that commit's message.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      # a Linux failure must not cancel win64 or block the dev release
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            plat: win64
            ext: .exe
          - os: ubuntu-latest
            plat: linux64
            ext: ""
    runs-on: ${{ matrix.os }}
    # linux64 is best-effort: a failure still zips/publishes what built
    continue-on-error: ${{ matrix.plat == 'linux64' }}
    steps:
      - uses: actions/checkout@v7

      - name: Configure
        # no -G: use whatever toolchain the runner image ships
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_RUNTIME_OUTPUT_DIRECTORY_RELEASE="${{ github.workspace }}/dist" -DCMAKE_RUNTIME_OUTPUT_DIRECTORY="${{ github.workspace }}/dist"

      - name: Build
        run: cmake --build build --config Release

      - name: Package
        shell: bash
        run: |
          sha=$(echo "${{ github.sha }}" | cut -c1-7)
          # both tools ship in one PulseModel/ folder inside the archive, with
          # the subtools in their own folder under it
          mkdir -p PulseModel
          cp "dist/mdlcompiler${{ matrix.ext }}" "dist/mdldecompiler${{ matrix.ext }}" \
             LICENSE README.md PulseModel/
          cp -r dist/subtools PulseModel/
          7z a -tzip "pulsemodel-${{ matrix.plat }}-$sha.zip" PulseModel/

      - uses: actions/upload-artifact@v7
        with:
          name: dev-${{ matrix.plat }}
          path: pulsemodel-*.zip

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          pattern: dev-*
          merge-multiple: true

      - name: Publish dev release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git log -1 --pretty=%B > notes.txt
          # replace the old dev release and its tag, so "dev" is always latest
          gh release delete dev --yes --cleanup-tag || true
          gh release create dev pulsemodel-*.zip \
            --target "${{ github.sha }}" \
            --title "Dev build (${GITHUB_SHA:0:7})" \
            --notes-file notes.txt \
            --prerelease \
            --latest=false
