name: Dev build

# Manual only. Overwrites the single rolling "dev" release with the current
# commit's build; the release body is that commit's message.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: windows-latest
            plat: win64
            ext: .exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        # no -G: use whatever toolchain the runner image ships
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_RUNTIME_OUTPUT_DIRECTORY_RELEASE="${{ github.workspace }}/dist" -DCMAKE_RUNTIME_OUTPUT_DIRECTORY="${{ github.workspace }}/dist"

      - name: Build
        run: cmake --build build --config Release

      - name: Package
        shell: bash
        run: |
          sha=$(echo "${{ github.sha }}" | cut -c1-7)
          # both tools ship in one PulseModel/ folder inside the archive,
          # with the helpers under PulseModel/subtools/
          mkdir -p PulseModel/subtools
          cp "dist/mdlcompiler${{ matrix.ext }}" "dist/mdldecompiler${{ matrix.ext }}" \
             LICENSE README.md PulseModel/
          cp "dist/subtools/importqc${{ matrix.ext }}" PulseModel/subtools/
          7z a -tzip "pulsemodel-${{ matrix.plat }}-$sha.zip" PulseModel/

      - uses: actions/upload-artifact@v4
        with:
          name: dev-${{ matrix.plat }}
          path: pulsemodel-*.zip

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: dev-*
          merge-multiple: true

      - name: Publish dev release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git log -1 --pretty=%B > notes.txt
          # replace the old dev release and its tag, so "dev" is always latest
          gh release delete dev --yes --cleanup-tag || true
          gh release create dev pulsemodel-*.zip \
            --target "${{ github.sha }}" \
            --title "Dev build (${GITHUB_SHA:0:7})" \
            --notes-file notes.txt \
            --prerelease \
            --latest=false
