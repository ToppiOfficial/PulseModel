name: Release

# Manual only. Creates one DRAFT release containing every tool.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            plat: win64
            ext: .exe
          - os: ubuntu-latest
            plat: linux64
            ext: ""
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.plat == 'linux64' }}
    steps:
      - uses: actions/checkout@v7

      - name: Configure
        # no -G: use whatever toolchain the runner image ships
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_RUNTIME_OUTPUT_DIRECTORY_RELEASE="${{ github.workspace }}/dist" -DCMAKE_RUNTIME_OUTPUT_DIRECTORY="${{ github.workspace }}/dist"

      - name: Build
        run: cmake --build build --config Release

      - name: Package
        shell: bash
        run: |
          # both tools ship in one PulseModel/ folder inside the archive, with
          # the subtools in their own folder under it
          mkdir -p PulseModel
          cp "dist/mdlcompiler${{ matrix.ext }}" "dist/mdldecompiler${{ matrix.ext }}" \
             LICENSE PulseModel/
          cp -r dist/subtools PulseModel/
          7z a -tzip "pulsemodel-${{ matrix.plat }}.zip" PulseModel/

      - uses: actions/upload-artifact@v7
        with:
          name: release-${{ matrix.plat }}
          path: pulsemodel-*.zip

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v8
        with:
          pattern: release-*
          merge-multiple: true

      - name: Build notes
        shell: bash
        run: |
          prev=$(git describe --tags --abbrev=0 --match 'release-*' 2>/dev/null || true)
          # Fall back to the old tags for the first numbered release.
          [ -z "$prev" ] && prev=$(git describe --tags --abbrev=0 --match 'v*' 2>/dev/null || true)
          [ -n "$prev" ] && range="$prev..HEAD" || range="HEAD"
          git log --reverse --pretty=format:%x00%B "$range" | python3 .github/scripts/release-notes.py > notes.txt
          cat notes.txt

      - name: Create draft release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "release-${{ github.run_number }}" pulsemodel-*.zip --target "${{ github.sha }}" --title "release-$(date -u +%-m/%-d/%Y)" --notes-file notes.txt --draft
