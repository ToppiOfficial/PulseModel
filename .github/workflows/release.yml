name: Release

# Manual only. Tags with mdlcompiler's TOOL_VERSION and creates a DRAFT release
# seeded with the commit message - nothing is published until you edit the notes
# and hit publish yourself.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: windows-latest
            plat: win64
            ext: .exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - name: Configure
        # no -G: use whatever toolchain the runner image ships
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_RUNTIME_OUTPUT_DIRECTORY_RELEASE="${{ github.workspace }}/dist" -DCMAKE_RUNTIME_OUTPUT_DIRECTORY="${{ github.workspace }}/dist"

      - name: Build
        run: cmake --build build --config Release

      - name: Package
        shell: bash
        run: |
          # both tools ship in one PulseModel/ folder inside the archive, with
          # the subtools in their own folder under it
          mkdir -p PulseModel
          cp "dist/mdlcompiler${{ matrix.ext }}" "dist/mdldecompiler${{ matrix.ext }}" \
             LICENSE PulseModel/
          cp -r dist/subtools PulseModel/
          7z a -tzip "pulsemodel-${{ matrix.plat }}.zip" PulseModel/

      - uses: actions/upload-artifact@v7
        with:
          name: release-${{ matrix.plat }}
          path: pulsemodel-*.zip

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v8
        with:
          pattern: release-*
          merge-multiple: true

      - name: Read version
        id: ver
        shell: bash
        run: |
          # each tool owns its version; the repo release tracks mdlcompiler's
          v=$(sed -n 's/^set(TOOL_VERSION \([0-9.]*\)).*/\1/p' mdlcompiler/CMakeLists.txt)
          echo "version=$v" >> "$GITHUB_OUTPUT"

      - name: Build notes
        shell: bash
        run: |
          # only v* tags count as a release; 'dev' and drafts never match
          prev=$(git describe --tags --abbrev=0 --match 'v*' 2>/dev/null || true)
          [ -n "$prev" ] && range="$prev..HEAD" || range="HEAD"
          git log --reverse --pretty=format:%x00%B "$range" | python3 .github/scripts/release-notes.py > notes.txt
          cat notes.txt

      - name: Create draft release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v${{ steps.ver.outputs.version }}" pulsemodel-*.zip --target "${{ github.sha }}" --title "release-$(date -u +%-m/%-d/%Y)" --notes-file notes.txt --draft
